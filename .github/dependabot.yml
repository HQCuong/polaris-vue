version: 2
updates:
  # @shopify/polaris-types is excluded: sync-polaris.yml bumps it and regenerates the wrappers.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@shopify/polaris-types"
      # Wait for typescript-eslint and vue-tsc to support the next TypeScript major.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Stays on the Node major in .nvmrc, so types can't offer APIs the runtime lacks.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

name: Feature request
description: Suggest an improvement to the wrappers, types or docs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem you hit, not just the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What the API or behavior could look like.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried

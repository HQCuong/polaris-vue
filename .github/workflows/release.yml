name: Release

# Publishes polaris-vue-elements to npm and creates a GitHub Release when a version tag is
# pushed. To cut a release: move the `## [Unreleased]` entries in CHANGELOG.md under a new
# `## [x.y.z] - YYYY-MM-DD` heading, bump `version` in package.json, commit, then push the
# tag `vx.y.z`. See "Releasing" in README.md.
#
# npm auth uses Trusted Publishing (OIDC) — no token is stored. The package must list this
# repo + `release.yml` as its trusted publisher on npmjs.com.
#
# Two jobs: `build` installs dependencies (running their install scripts), checks and packs
# the tarball with no write access; `publish` never installs dependencies, and is the only
# job that can mint an OIDC token or write to the repo.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Extract release notes from CHANGELOG.md
        run: node scripts/changelog.mjs notes "${{ steps.meta.outputs.version }}" > notes.md

      - name: Lint
        run: |
          npx oxlint .
          npx eslint .

      - name: Verify generated code is up to date
        run: |
          npm run generate
          npm run docs:generate
          git diff --exit-code

      # Same checks as `prepublishOnly`, which does not run when publishing a tarball.
      - name: Type-check, test and build
        run: |
          npm run type-check
          npx vitest run
          npm run build:lib

      - name: Pack
        run: |
          npm pack
          mv polaris-vue-elements-*.tgz package.tgz

      - name: Upload tarball and release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            package.tgz
            notes.md
          if-no-files-found: error

  publish:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Check npm supports Trusted Publishing
        run: |
          # Trusted Publishing needs npm >= 11.5.1.
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)" \
            || npm install -g npm@^11.5.1

      - name: Download tarball and release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Publish to npm
        run: |
          if npm view "polaris-vue-elements@$VERSION" version >/dev/null 2>&1; then
            echo "polaris-vue-elements@$VERSION is already on npm, skipping publish (re-run)."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            npm publish package.tgz --access public --tag next
          else
            npm publish package.tgz --access public
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping."
            exit 0
          fi
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $FLAGS

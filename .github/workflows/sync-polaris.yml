name: Sync @shopify/polaris-types

on:
  schedule:
    # 03:17 UTC daily - off-peak, minute offset to avoid the top-of-hour stampede.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Check for polaris-types update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compare installed vs. latest version
        id: versions
        run: |
          CURRENT=$(node -p "require('./node_modules/@shopify/polaris-types/package.json').version")
          LATEST=$(npm view @shopify/polaris-types version)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          # The Polaris CDN is semver'd and @shopify/polaris-types shares its major, so a
          # major bump here means consumers must also switch CDN URLs (polaris-1.js ->
          # polaris-2.js). Flag it so it is never merged as a routine sync.
          if [ "${CURRENT%%.*}" != "${LATEST%%.*}" ]; then
            echo "major=true" >> "$GITHUB_OUTPUT"
          else
            echo "major=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "up to date ($CURRENT)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "update available: $CURRENT -> $LATEST"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install latest @shopify/polaris-types
        if: steps.versions.outputs.changed == 'true'
        run: npm install -D @shopify/polaris-types@latest

      - name: Regenerate wrappers
        if: steps.versions.outputs.changed == 'true'
        run: npm run generate

      # Component-level changes are recorded automatically; prop/slot/icon-level changes
      # still need a human pass over the diff before release (see the PR body).
      - name: Record the sync in CHANGELOG.md
        if: steps.versions.outputs.changed == 'true'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          node scripts/changelog.mjs add Changed "Regenerated from \`@shopify/polaris-types\` ${LATEST} (was ${CURRENT})."
          for name in $(git diff -U0 -- src/lib/generated/components.ts | sed -n 's/^+export const \(S[A-Za-z0-9]*\) = .*/\1/p'); do
            node scripts/changelog.mjs add Added "\`${name}\` wrapper (new in \`@shopify/polaris-types\` ${LATEST})."
          done
          for name in $(git diff -U0 -- src/lib/generated/components.ts | sed -n 's/^-export const \(S[A-Za-z0-9]*\) = .*/\1/p'); do
            node scripts/changelog.mjs add Removed "**Breaking:** \`${name}\` wrapper — the component was removed in \`@shopify/polaris-types\` ${LATEST}."
          done

      # Fails by design when Shopify ships a new component: scripts/generate-docs.mjs
      # requires every tag to be filed in its hand-maintained CATEGORIES map. Report it
      # on the PR instead of blocking the sync.
      - name: Regenerate docs pages
        id: check_docs
        if: steps.versions.outputs.changed == 'true'
        continue-on-error: true
        run: npm run docs:generate

      # Manifest descriptions feed the docs pages verbatim, so a new release can break the
      # VitePress build (e.g. dead links) and with it the Cloudflare deploy after merge.
      - name: Build docs
        id: check_docsbuild
        if: steps.versions.outputs.changed == 'true' && steps.check_docs.outcome == 'success'
        continue-on-error: true
        run: npm run docs:build

      - name: oxlint
        id: check_oxlint
        if: steps.versions.outputs.changed == 'true'
        continue-on-error: true
        run: npx oxlint .

      - name: eslint
        id: check_eslint
        if: steps.versions.outputs.changed == 'true'
        continue-on-error: true
        run: npx eslint .

      - name: Type-check
        id: check_typecheck
        if: steps.versions.outputs.changed == 'true'
        continue-on-error: true
        run: npm run type-check

      - name: Unit tests
        id: check_vitest
        if: steps.versions.outputs.changed == 'true'
        continue-on-error: true
        run: npx vitest run

      - name: Build PR summary
        id: summary
        if: steps.versions.outputs.changed == 'true'
        run: |
          status() {
            case "$1" in
              success) echo "passed" ;;
              failure) echo "FAILED" ;;
              skipped) echo "skipped" ;;
              *) echo "$1" ;;
            esac
          }

          OXLINT_STATUS=$(status "${{ steps.check_oxlint.outcome }}")
          ESLINT_STATUS=$(status "${{ steps.check_eslint.outcome }}")
          TYPECHECK_STATUS=$(status "${{ steps.check_typecheck.outcome }}")
          VITEST_STATUS=$(status "${{ steps.check_vitest.outcome }}")
          DOCS_STATUS=$(status "${{ steps.check_docs.outcome }}")
          DOCSBUILD_STATUS=$(status "${{ steps.check_docsbuild.outcome }}")

          {
            if [ "${{ steps.versions.outputs.major }}" = "true" ]; then
              echo "> [!WARNING]"
              echo "> **Major version bump.** \`@shopify/polaris-types\` shares its major with the Polaris CDN, so this release targets a new CDN channel (\`polaris-<major>.js\`). Before merging: update the CDN URL in README, docs and \`index.html\`, verify the new runtime in a real browser, and release \`polaris-vue-elements\` as a new major."
              echo ""
            fi
            echo "Automated sync of \`@shopify/polaris-types\` from \`${{ steps.versions.outputs.current }}\` to \`${{ steps.versions.outputs.latest }}\`."
            echo ""
            echo "Generated with \`npm run generate\` and pushed here for review. New and removed components were added to the \`## [Unreleased]\` section of \`CHANGELOG.md\`; before the next release, review \`src/lib/generated/types.ts\` in this diff and note prop, slot and icon changes there too (especially removals, which are breaking)."
            echo ""
            echo "### Check results"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| oxlint | ${OXLINT_STATUS} |"
            echo "| eslint | ${ESLINT_STATUS} |"
            echo "| type-check | ${TYPECHECK_STATUS} |"
            echo "| vitest | ${VITEST_STATUS} |"
            echo "| docs:generate | ${DOCS_STATUS} |"
            echo "| docs:build | ${DOCSBUILD_STATUS} |"
            echo ""
            if [ "$OXLINT_STATUS" = "passed" ] && [ "$ESLINT_STATUS" = "passed" ] && [ "$TYPECHECK_STATUS" = "passed" ] && [ "$VITEST_STATUS" = "passed" ] && [ "$DOCS_STATUS" = "passed" ] && [ "$DOCSBUILD_STATUS" = "passed" ]; then
              echo "All checks passed. This should be safe to review and merge."
            else
              echo "One or more checks FAILED. Investigate before merging - a common cause is a new form-like component missing a \`v-model\` override in \`src/lib/overrides.ts\`, or a new component missing from \`CATEGORIES\` in \`scripts/generate-docs.mjs\` (docs:generate), or manifest text that breaks the VitePress build (docs:build)."
            fi
          } > "$RUNNER_TEMP/pr-body.md"

          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update pull request
        if: steps.versions.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync @shopify/polaris-types to ${{ steps.versions.outputs.latest }}"
          title: "${{ steps.versions.outputs.major == 'true' && '[MAJOR] ' || '' }}chore: sync @shopify/polaris-types to ${{ steps.versions.outputs.latest }}"
          body-path: ${{ runner.temp }}/pr-body.md
          branch: sync/polaris-types
          base: main
          delete-branch: true

  # Polaris CSS variables (tokens/tokens.json -> tokens/tokens.css) come from the CDN
  # runtime, not from @shopify/polaris-types, so they can change on any day without a
  # package release. Separate job: a token change never blocks or mixes with a types sync.
  tokens:
    name: Check for Polaris CSS token changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No continue-on-error: the extractor's guard (too few tokens, a >20% drop, CSS that
      # no longer parses) must fail this job loudly rather than open a PR that wipes tokens.
      - name: Extract tokens from the Polaris CDN
        run: node scripts/extract-tokens.mjs --summary "$RUNNER_TEMP/tokens-diff.md"

      - name: Regenerate tokens.css
        run: npm run generate

      - name: Detect token changes
        id: tokens
        run: |
          if git diff --quiet -- tokens/; then
            echo "no token changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat -- tokens/
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate docs pages
        id: check_docs
        if: steps.tokens.outputs.changed == 'true'
        continue-on-error: true
        run: npm run docs:generate

      # The CSS variables page renders tokens.json at build time.
      - name: Build docs
        id: check_docsbuild
        if: steps.tokens.outputs.changed == 'true' && steps.check_docs.outcome == 'success'
        continue-on-error: true
        run: npm run docs:build

      - name: oxlint
        id: check_oxlint
        if: steps.tokens.outputs.changed == 'true'
        continue-on-error: true
        run: npx oxlint .

      - name: eslint
        id: check_eslint
        if: steps.tokens.outputs.changed == 'true'
        continue-on-error: true
        run: npx eslint .

      - name: Type-check
        id: check_typecheck
        if: steps.tokens.outputs.changed == 'true'
        continue-on-error: true
        run: npm run type-check

      - name: Unit tests
        id: check_vitest
        if: steps.tokens.outputs.changed == 'true'
        continue-on-error: true
        run: npx vitest run

      - name: Build PR summary
        if: steps.tokens.outputs.changed == 'true'
        run: |
          status() {
            case "$1" in
              success) echo "passed" ;;
              failure) echo "FAILED" ;;
              skipped) echo "skipped" ;;
              *) echo "$1" ;;
            esac
          }

          OXLINT_STATUS=$(status "${{ steps.check_oxlint.outcome }}")
          ESLINT_STATUS=$(status "${{ steps.check_eslint.outcome }}")
          TYPECHECK_STATUS=$(status "${{ steps.check_typecheck.outcome }}")
          VITEST_STATUS=$(status "${{ steps.check_vitest.outcome }}")
          DOCS_STATUS=$(status "${{ steps.check_docs.outcome }}")
          DOCSBUILD_STATUS=$(status "${{ steps.check_docsbuild.outcome }}")

          # GitHub caps PR bodies at 65536 characters; a big token rename can exceed that.
          DIFF_FILE="$RUNNER_TEMP/tokens-diff.md"
          if [ "$(wc -c < "$DIFF_FILE")" -gt 50000 ]; then
            head -c 50000 "$DIFF_FILE" > "$DIFF_FILE.cut"
            printf '\n\n…truncated; see the diff of `tokens/tokens.json`.\n' >> "$DIFF_FILE.cut"
            DIFF_FILE="$DIFF_FILE.cut"
          fi

          {
            echo "Automated sync of the Polaris CSS variables extracted from the Polaris runtime on Shopify's CDN (\`$(node -p "require('./tokens/tokens.json').source")\`)."
            echo ""
            echo "Generated with \`node scripts/extract-tokens.mjs\` and \`npm run generate\`. Removed or renamed variables break apps that use them: note them in the \`## [Unreleased]\` section of \`CHANGELOG.md\` before the next release."
            echo ""
            echo "### Token changes"
            echo ""
            cat "$DIFF_FILE"
            echo ""
            echo "### Check results"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| oxlint | ${OXLINT_STATUS} |"
            echo "| eslint | ${ESLINT_STATUS} |"
            echo "| type-check | ${TYPECHECK_STATUS} |"
            echo "| vitest | ${VITEST_STATUS} |"
            echo "| docs:generate | ${DOCS_STATUS} |"
            echo "| docs:build | ${DOCSBUILD_STATUS} |"
            echo ""
            if [ "$OXLINT_STATUS" = "passed" ] && [ "$ESLINT_STATUS" = "passed" ] && [ "$TYPECHECK_STATUS" = "passed" ] && [ "$VITEST_STATUS" = "passed" ] && [ "$DOCS_STATUS" = "passed" ] && [ "$DOCSBUILD_STATUS" = "passed" ]; then
              echo "All checks passed. This should be safe to review and merge."
            else
              echo "One or more checks FAILED. Investigate before merging - a common cause is a token value the docs page can't render (docs:build)."
            fi
          } > "$RUNNER_TEMP/tokens-pr-body.md"

          cat "$RUNNER_TEMP/tokens-pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update pull request
        if: steps.tokens.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync Polaris CSS tokens"
          title: "chore: sync Polaris CSS tokens"
          body-path: ${{ runner.temp }}/tokens-pr-body.md
          branch: sync/polaris-tokens
          base: main
          delete-branch: true
          # The docs page's migration lists compare tokens.json with @shopify/polaris-tokens.
          add-paths: |
            tokens/
            docs/.vitepress/polaris-tokens-migration.json

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: oxlint (no autofix)
        run: npx oxlint .

      - name: eslint (no autofix)
        run: npx eslint .

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Build library
        run: npm run build:lib

      # Same freshness check release.yml runs, so a PR can't pass here and then fail the release.
      - name: Verify generated code is up to date
        run: |
          npm run generate
          npm run docs:generate
          git diff --exit-code

      # The Cloudflare deploy runs this after merge; catch dead links and broken pages first.
      - name: Build docs
        run: npm run docs:build

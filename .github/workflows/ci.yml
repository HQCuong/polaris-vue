name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: oxlint (no autofix)
        run: npx oxlint .

      - name: eslint (no autofix)
        run: npx eslint .

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Build library
        run: npm run build:lib

      - name: Verify generated code is up to date
        run: |
          npm run generate
          git diff --exit-code
